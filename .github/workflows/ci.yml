# One pipeline for the website and the JVM side. Every job is one script in tools/ci/ and nothing else:
# the build box's local pipeline (`box.sh <stream> ci`) runs the same scripts, so a green box run is a
# green run here. Change a job by changing its script, not this file.
#
# `changes` decides which jobs a diff needs (tools/ci/changes.sh); a skipped job counts as passed.
# `ci-ok` is the one check to require on a branch: it fails if any job that ran failed.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - restructure
      - "fix/**"
      - "rs/**"

# actions: read lets a job list and download the dependency seeds earlier runs uploaded (tools/ci/seed.sh).
permissions:
  contents: read
  actions: read

# npm retries a failed registry request twice by default; give a stalling registry minutes, not seconds.
env:
  NPM_CONFIG_FETCH_RETRIES: "6"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "5000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"
  NPM_CONFIG_FETCH_TIMEOUT: "120000"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which jobs this change needs
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.changes.outputs.website }}
      icons: ${{ steps.changes.outputs.icons }}
      jvm: ${{ steps.changes.outputs.jvm }}
      web_core: ${{ steps.changes.outputs.web_core }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Licence files and version tags agree
        run: tools/ci/metadata.sh
      - id: changes
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/ci/changes.sh

  website:
    name: Typecheck and test
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: tools/ci/website.sh

  icons:
    name: Icon sizing in Chromium and Firefox
    needs: changes
    if: needs.changes.outputs.icons == 'true'
    runs-on: ubuntu-latest
    # The browser install pulls system packages and has taken over 9 minutes on a slow runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore the browsers from the last seed
        run: tools/ci/seed.sh restore playwright
        env:
          GH_TOKEN: ${{ github.token }}
      - run: tools/ci/icons.sh
        env:
          CI_INSTALL_BROWSERS: "1"
      - name: Pack the browsers when they changed
        id: seed
        if: ${{ !cancelled() }}
        run: tools/ci/seed.sh save playwright
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.seed.outputs.upload == 'true' }}
        with:
          name: ${{ steps.seed.outputs.name }}
          path: ${{ steps.seed.outputs.file }}
          compression-level: 0
          retention-days: ${{ steps.seed.outputs.retention }}

  jvm:
    name: JVM build, tests and compat check
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # Everything the build fetches (dependencies, the Gradle distribution, RetroFuturaGradle's Minecraft data and its
      # decompiled game) comes from the newest seed an earlier run on restructure or rs/** uploaded, so the build does not
      # need the dependency servers in the usual case. See tools/ci/seed.sh for why this is not the Gradle action's cache.
      - name: Restore the dependency seed
        run: tools/ci/seed.sh restore jvm
        env:
          GH_TOKEN: ${{ github.token }}
      # Gradle itself runs on 25 (the last version listed is the default JAVA_HOME); the mod compiles
      # against 8 and tests on 17 and 21 through Gradle's toolchains, which find the JAVA_HOME_<n>_X64
      # variables this step sets. Zulu is the vendor the build's toolchains ask for.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - run: tools/ci/jvm.sh
      # Also after a failed build: what it did fetch is kept, so the next run needs less.
      - name: Pack the seed when it was short
        id: seed
        if: ${{ !cancelled() }}
        run: tools/ci/seed.sh save jvm
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.seed.outputs.upload == 'true' }}
        with:
          name: ${{ steps.seed.outputs.name }}
          path: ${{ steps.seed.outputs.file }}
          compression-level: 0
          retention-days: ${{ steps.seed.outputs.retention }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-results
          path: |
            jvm/mod/build/libs/*.jar
            jvm/mod/build/reports/tests
            jvm/core/*/build/reports/tests
            jvm/web/*/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  web-core:
    name: Core in the browser build (TeaVM and conformance in Node)
    needs: changes
    if: needs.changes.outputs.web_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - name: Restore the dependency seed
        run: tools/ci/seed.sh restore web-core
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: tools/ci/web-core.sh
      - name: Pack the seed when it was short
        id: seed
        if: ${{ !cancelled() }}
        run: tools/ci/seed.sh save web-core
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.seed.outputs.upload == 'true' }}
        with:
          name: ${{ steps.seed.outputs.name }}
          path: ${{ steps.seed.outputs.file }}
          compression-level: 0
          retention-days: ${{ steps.seed.outputs.retention }}

  ci-ok:
    name: ci-ok
    needs: [changes, website, icons, jvm, web-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "a job finished as: $r"; exit 1 ;;
            esac
          done
          # `changes` itself must have run: if it was skipped or cancelled, nothing was checked.
          [ "${{ needs.changes.result }}" = success ]

# The Gradle root for everything on the JVM side: the mod (mod/) and the plain-Java core modules (core/<name>/).
# Gradle reads org.gradle.* only from the root's file, and the GTNH settings plugin reads its gtnh.settings.* here.
# The mod's own properties are in mod/gradle.properties.

# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
# LOCAL to test local config updates.
gtnh.settings.blowdryerTag = 0.2.2

# The settings plugin fails without these three, though only the mod uses them; mod/gradle.properties has the same
# values and is the file the mod's build reads (a subproject's own properties win over the root's).
modName = GTNH Planner
modId = gtnhplanner
modGroup = com.gtnhplanner

org.gradle.configuration-cache = true
org.gradle.parallel = true

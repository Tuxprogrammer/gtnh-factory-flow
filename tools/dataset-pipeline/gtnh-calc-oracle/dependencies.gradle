// The GregTech the planner mod compiles against (jvm/mod/dependencies.gradle), because this jar compiles the mod's
// recipe reader (com.gtnhplanner.read.gt, see build.gradle): one reader, one set of GregTech symbols. The pack ships
// a newer build; the reader reaches what moved between builds by reflection.
dependencies {
    implementation("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.205:dev")

    shadowImplementation("com.google.code.gson:gson:2.10.1")
}
